name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Prisma config validates only the URL shape during generate/validate;
      # CI unit/type/build jobs do not connect to this placeholder database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Verify pinned Node.js and pnpm
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = require("./package.json");
            const expectedNodeMajor = fs.readFileSync(".nvmrc", "utf8").trim();
            const actualNodeMajor = process.versions.node.split(".")[0];
            if (actualNodeMajor !== expectedNodeMajor) {
              throw new Error(`Expected Node.js ${expectedNodeMajor}.x, got ${process.versions.node}`);
            }
            const packageManager = manifest.packageManager;
            if (typeof packageManager !== "string" || !packageManager.startsWith("pnpm@")) {
              throw new Error("package.json must pin pnpm via packageManager");
            }
            const expectedPnpm = packageManager.slice("pnpm@".length);
            const actualPnpm = require("node:child_process")
              .execFileSync("pnpm", ["--version"], { encoding: "utf8" })
              .trim();
            if (actualPnpm !== expectedPnpm) {
              throw new Error(`Expected pnpm ${expectedPnpm}, got ${actualPnpm}`);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm prisma:generate

      - name: Validate Prisma schemas
        run: pnpm prisma:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate infrastructure example
        run: pnpm infra:validate:example

      - name: Build
        run: pnpm build

  postgres-18:
    name: PostgreSQL 18 migrations and races
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PLATFORM_API_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_platform_test
      SEO_DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_data_test
      JOBS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_jobs_test
      JOBS_UPGRADE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_jobs_upgrade_test
      JOBS_CONNECTOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobs_db
      REALTIME_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_realtime_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Verify pinned Node.js and pnpm
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = require("./package.json");
            const expectedNodeMajor = fs.readFileSync(".nvmrc", "utf8").trim();
            const actualNodeMajor = process.versions.node.split(".")[0];
            if (actualNodeMajor !== expectedNodeMajor) {
              throw new Error(`Expected Node.js ${expectedNodeMajor}.x, got ${process.versions.node}`);
            }
            const packageManager = manifest.packageManager;
            if (typeof packageManager !== "string" || !packageManager.startsWith("pnpm@")) {
              throw new Error("package.json must pin pnpm via packageManager");
            }
            const expectedPnpm = packageManager.slice("pnpm@".length);
            const actualPnpm = require("node:child_process")
              .execFileSync("pnpm", ["--version"], { encoding: "utf8" })
              .trim();
            if (actualPnpm !== expectedPnpm) {
              throw new Error(`Expected pnpm ${expectedPnpm}, got ${actualPnpm}`);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @seo-platform/contracts build

      - name: Generate Prisma clients
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm prisma:generate

      - name: Create disposable service databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres seo_platform_test
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres seo_data_test
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres seo_jobs_test
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres seo_jobs_upgrade_test
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres jobs_db
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres seo_realtime_test

      - name: Apply Platform API migrations
        working-directory: platform-api
        env:
          DATABASE_URL: ${{ env.PLATFORM_API_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Apply SEO Data migrations
        working-directory: platform-seo-data
        env:
          DATABASE_URL: ${{ env.SEO_DATA_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Apply Jobs migrations
        working-directory: platform-jobs-integrations
        env:
          DATABASE_URL: ${{ env.JOBS_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Apply Jobs pre-submit-authorization upgrade baseline
        run: |
          for migration in platform-jobs-integrations/prisma/migrations/*/migration.sql; do
            case "$migration" in
              *20260730101700_rank_connector_submitting_enum*|*20260730101800_rank_connector_submit_authorization*)
                break
                ;;
            esac
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -U postgres -d seo_jobs_upgrade_test \
              < "$migration"
          done

      - name: Apply connector permission database migrations
        working-directory: platform-jobs-integrations
        env:
          DATABASE_URL: ${{ env.JOBS_CONNECTOR_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Apply Realtime migrations
        working-directory: platform-realtime
        env:
          DATABASE_URL: ${{ env.REALTIME_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Verify Platform API migration state
        working-directory: platform-api
        env:
          DATABASE_URL: ${{ env.PLATFORM_API_DATABASE_URL }}
        run: pnpm exec prisma migrate status

      - name: Verify SEO Data migration state
        working-directory: platform-seo-data
        env:
          DATABASE_URL: ${{ env.SEO_DATA_DATABASE_URL }}
        run: pnpm exec prisma migrate status

      - name: Verify Jobs migration state
        working-directory: platform-jobs-integrations
        env:
          DATABASE_URL: ${{ env.JOBS_DATABASE_URL }}
        run: pnpm exec prisma migrate status

      - name: Verify Realtime migration state
        working-directory: platform-realtime
        env:
          DATABASE_URL: ${{ env.REALTIME_DATABASE_URL }}
        run: pnpm exec prisma migrate status

      - name: Run Platform API PostgreSQL races
        working-directory: platform-api
        env:
          DATABASE_URL: ${{ env.PLATFORM_API_DATABASE_URL }}
          PLATFORM_API_RANK_GRANT_TEST_DATABASE_URL: ${{ env.PLATFORM_API_DATABASE_URL }}
        run: pnpm test

      - name: Run Jobs PostgreSQL races
        working-directory: platform-jobs-integrations
        env:
          DATABASE_URL: ${{ env.JOBS_DATABASE_URL }}
          JOBS_RANK_TEST_DATABASE_URL: ${{ env.JOBS_DATABASE_URL }}
          JOBS_RANK_SUBMIT_UPGRADE_TEST_DATABASE_URL: ${{ env.JOBS_UPGRADE_DATABASE_URL }}
        run: pnpm test

      - name: Install generated connector HBA policy
        run: |
          hba_path="$(
            docker exec "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres \
              --command='SHOW hba_file'
          )"
          /bin/sh platform-infrastructure/postgres/config/start-postgres.sh \
            --print-hba \
            | docker exec -i "${{ job.services.postgres.id }}" \
                sh -c 'cat > "$1"' sh "$hba_path"
          docker exec "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            --command='SELECT pg_reload_conf()'

      - name: Run connector-role and HBA PostgreSQL regression
        env:
          JOBS_CONNECTOR_PERMISSION_TEST_DATABASE_URL: ${{ env.JOBS_CONNECTOR_DATABASE_URL }}
          JOBS_CONNECTOR_PERMISSION_TEST_EXPECT_HBA: "true"
        run: node --test platform-infrastructure/tests/jobs-connector-permissions-postgres.test.mjs
