packages:
  - "platform-contracts"
  - "platform-api"
  - "platform-seo-data"
  - "platform-jobs-integrations"
  - "platform-realtime"
  - "platform-app"
  - "platform-admin"
  - "platform-marketing"

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
