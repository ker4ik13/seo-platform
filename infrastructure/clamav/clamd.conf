Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
MaxConnectionQueueLength 30
MaxThreads 4
MaxQueue 30

StreamMaxLength 5G
MaxScanSize 5G
MaxFileSize 5G
MaxRecursion 16
MaxFiles 100000
MaxEmbeddedPE 512M

ReadTimeout 900
CommandReadTimeout 30
SendBufTimeout 500
SelfCheck 600

ScanArchive yes
ScanOLE2 yes
ScanPDF yes
ScanPE yes
ScanELF yes
Bytecode yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
