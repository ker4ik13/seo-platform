services:
  execution-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: runtime
      args:
        PACKAGE_NAME: "@seo-platform/backend-execution"
    command: ["node", "dist/remote-worker.main.js"]
    environment:
      NODE_ENV: production
      WORKER_CONTROL_URL: ${WORKER_CONTROL_URL:?HTTPS control URL is required}
      WORKER_NODE_ID: ${WORKER_NODE_ID:?Worker node ID is required}
      WORKER_NODE_TOKEN_FILE: /run/secrets/worker-node-token
      WORKER_HTTP_SLOTS: ${WORKER_HTTP_SLOTS:-16}
      WORKER_RANK_SLOTS: ${WORKER_RANK_SLOTS:-0}
      WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-2}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-10000}
    volumes:
      - type: bind
        source: ${WORKER_NODE_TOKEN_SOURCE:?Private token file is required}
        target: /run/secrets/worker-node-token
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: ${WORKER_CONTAINER_CPUS:-4.0}
    mem_limit: ${WORKER_CONTAINER_MEMORY:-8g}
    restart: unless-stopped
    stop_grace_period: 45s
