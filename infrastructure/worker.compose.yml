services:
  execution-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: remote-worker
      args:
        PACKAGE_NAME: "@seo-platform/backend-execution"
    environment:
      NODE_ENV: production
      WORKER_CONTROL_URL: ${WORKER_CONTROL_URL:?HTTPS control URL is required}
      WORKER_NODE_ID: ${WORKER_NODE_ID:?Worker node ID is required}
      WORKER_NODE_TOKEN: ${WORKER_NODE_TOKEN:?Worker node token is required}
      WORKER_HTTP_SLOTS: ${WORKER_HTTP_SLOTS:-16}
      WORKER_RANK_SLOTS: ${WORKER_RANK_SLOTS:-0}
      WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-2}
      WORKER_WORDSTAT_SLOTS: ${WORKER_WORDSTAT_SLOTS:-}
      WORKER_RESEARCH_SLOTS: ${WORKER_RESEARCH_SLOTS:-}
      WORKER_AI_ANSWER_SLOTS: ${WORKER_AI_ANSWER_SLOTS:-}
      WORKER_CLUSTERING_SLOTS: ${WORKER_CLUSTERING_SLOTS:-}
      WORKER_CRAWL_SLOTS: ${WORKER_CRAWL_SLOTS:-}
      WORKER_IMPORT_SLOTS: ${WORKER_IMPORT_SLOTS:-}
      WORKER_EXPORT_SLOTS: ${WORKER_EXPORT_SLOTS:-}
      WORKER_INSPECTION_SLOTS: ${WORKER_INSPECTION_SLOTS:-1}
      WORKER_CPU_TASK_MEMORY_MB: ${WORKER_CPU_TASK_MEMORY_MB:-1024}
      WORKER_MALWARE_SCANNER_HOST: clamav
      WORKER_MALWARE_SCANNER_PORT: 3310
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-10000}
    read_only: true
    volumes:
      - worker_tmp:/tmp
    depends_on:
      clamav:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: ${WORKER_CONTAINER_CPUS:-4.0}
    mem_limit: ${WORKER_CONTAINER_MEMORY:-8g}
    restart: unless-stopped
    stop_grace_period: 45s
  clamav:
    build:
      context: ..
      dockerfile: infrastructure/docker/infra.Dockerfile
      target: clamav-runtime
    volumes:
      - worker_clamav_data:/var/lib/clamav
    cpus: ${WORKER_SCANNER_CPUS:-1.0}
    mem_limit: ${WORKER_SCANNER_MEMORY:-2g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

volumes:
  worker_tmp:
  worker_clamav_data:
