    volumes:
      - nats_data:/data
    read_only: true
    tmpfs:
      - /run/nats-runtime:rw,noexec,nosuid,size=1m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    depends_on:
      service-token-preflight:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  nats-topology-provisioner:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: nats-provisioner
