      WEB_PUSH_DELIVERY_TTL_SECONDS: ${WEB_PUSH_DELIVERY_TTL_SECONDS:-3600}
      WEB_PUSH_EXPIRY_SWEEP_INTERVAL_MS: ${WEB_PUSH_EXPIRY_SWEEP_INTERVAL_MS:-60000}
      WEB_PUSH_EXPIRY_SWEEP_BATCH_SIZE: ${WEB_PUSH_EXPIRY_SWEEP_BATCH_SIZE:-100}
    expose:
      - "4000"
      - "4001"
      - "4003"
      - "4004"
    networks:
      - internal
      - edge
      - outbound
      - realtime-redis
    depends_on:
      platform-runtime-db-permissions:
        condition: service_completed_successfully
      seo-runtime-db-permissions:
        condition: service_completed_successfully
      realtime-runtime-db-permissions:
        condition: service_completed_successfully
      realtime-web-push-db-permissions:
        condition: service_completed_successfully
      service-token-preflight:
        condition: service_completed_successfully
      redis-realtime:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-topology-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([4000,4003,4004].map(p=>fetch('http://127.0.0.1:'+p+'/health/ready').then(r=>{if(!r.ok)throw Error()}))).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-execution:
    <<: *backend-defaults
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: runtime
      args:
        PACKAGE_NAME: "@seo-platform/backend-execution"
    environment:
      <<: [*common-backend-env, *jobs-s3-env, *jobs-upload-command-env, *jobs-inspection-env, *jobs-import-env, *jobs-seo-data-env, *auth-email-runtime-env]
      BIND_ADDRESS: 0.0.0.0
      PORT: 4002
      NATS_URL: nats://nats:4222
      EXECUTION_HTTP_DATABASE_URL: postgresql://jobs_runtime:${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_HTTP_DATABASE_POOL_MAX: ${JOBS_DATABASE_POOL_MAX:-30}
      EXECUTION_HTTP_REDIS_URL: redis://seo_jobs_api:${REDIS_JOBS_API_PASSWORD:?REDIS_JOBS_API_PASSWORD is required}@redis-jobs:6379
      EXECUTION_HTTP_NATS_USER: ${NATS_RUNTIME_USER:?NATS_RUNTIME_USER is required}
      EXECUTION_HTTP_NATS_PASSWORD: ${NATS_RUNTIME_PASSWORD:?NATS_RUNTIME_PASSWORD is required}
      EXECUTION_SYSTEM_REDIS_URL: redis://seo_jobs_system:${REDIS_JOBS_SYSTEM_PASSWORD:?REDIS_JOBS_SYSTEM_PASSWORD is required}@redis-jobs:6379
      SYSTEM_WORKER_CONCURRENCY: ${SYSTEM_WORKER_CONCURRENCY:-2}
      EXECUTION_INSPECTION_DATABASE_URL: postgresql://jobs_runtime:${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_INSPECTION_DATABASE_POOL_MAX: ${JOBS_INSPECTION_DATABASE_POOL_MAX:-10}
      EXECUTION_INSPECTION_REDIS_URL: redis://seo_jobs_inspection:${REDIS_JOBS_INSPECTION_PASSWORD:?REDIS_JOBS_INSPECTION_PASSWORD is required}@redis-jobs:6379
      INSPECTION_WORKER_ENABLED: ${MALWARE_SCANNER_ENABLED:-false}
      EXECUTION_IMPORT_DATABASE_URL: postgresql://jobs_runtime:${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_IMPORT_DATABASE_POOL_MAX: ${JOBS_IMPORT_DATABASE_POOL_MAX:-10}
      EXECUTION_IMPORT_REDIS_URL: redis://seo_jobs_import:${REDIS_JOBS_IMPORT_PASSWORD:?REDIS_JOBS_IMPORT_PASSWORD is required}@redis-jobs:6379
      EXECUTION_RANK_DATABASE_URL: postgresql://jobs_rank_runtime:${JOBS_RANK_DATABASE_PASSWORD:?JOBS_RANK_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_RANK_DATABASE_POOL_MAX: ${JOBS_RANK_DATABASE_POOL_MAX:-5}
      EXECUTION_RANK_REDIS_URL: redis://seo_jobs_rank:${REDIS_JOBS_RANK_PASSWORD:?REDIS_JOBS_RANK_PASSWORD is required}@redis-jobs:6379
      RANK_WORKER_PROCESSES: ${RANK_WORKER_PROCESSES:-2}
      EXECUTION_CRAWL_DATABASE_URL: postgresql://jobs_runtime:${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_CRAWL_DATABASE_POOL_MAX: ${JOBS_CRAWL_DATABASE_POOL_MAX:-10}
      EXECUTION_CRAWL_REDIS_URL: redis://seo_jobs_crawl:${REDIS_JOBS_CRAWL_PASSWORD:?REDIS_JOBS_CRAWL_PASSWORD is required}@redis-jobs:6379
      EXECUTION_CONNECTOR_DATABASE_URL: postgresql://jobs_connector:${JOBS_CONNECTOR_DATABASE_PASSWORD:?JOBS_CONNECTOR_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_CONNECTOR_DATABASE_POOL_MAX: ${JOBS_CONNECTOR_DATABASE_POOL_MAX:-12}
      EXECUTION_CONNECTOR_REDIS_URL: redis://seo_jobs_connector:${REDIS_JOBS_CONNECTOR_PASSWORD:?REDIS_JOBS_CONNECTOR_PASSWORD is required}@redis-jobs:6379
      CONNECTOR_WORKER_PROCESSES: ${CONNECTOR_WORKER_PROCESSES:-3}
      EXECUTION_AUTH_EMAIL_DATABASE_URL: postgresql://jobs_auth_email_runtime:${JOBS_AUTH_EMAIL_DATABASE_PASSWORD:?JOBS_AUTH_EMAIL_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      EXECUTION_AUTH_EMAIL_DATABASE_POOL_MAX: ${JOBS_AUTH_EMAIL_DATABASE_POOL_MAX:-5}
      EXECUTION_AUTH_EMAIL_NATS_USER: ${NATS_AUTH_EMAIL_CONSUMER_USER:?NATS_AUTH_EMAIL_CONSUMER_USER is required}
      EXECUTION_AUTH_EMAIL_NATS_PASSWORD: ${NATS_AUTH_EMAIL_CONSUMER_PASSWORD:?NATS_AUTH_EMAIL_CONSUMER_PASSWORD is required}
      PLATFORM_API_TO_JOBS_TOKEN: ${PLATFORM_API_TO_JOBS_TOKEN:?PLATFORM_API_TO_JOBS_TOKEN is required}
      PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN: ${PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN:?PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN is required}
      JOBS_TO_PLATFORM_AUTOMATION_TOKEN: ${JOBS_TO_PLATFORM_AUTOMATION_TOKEN:?JOBS_TO_PLATFORM_AUTOMATION_TOKEN is required}
      JOBS_TO_PLATFORM_RANK_GRANT_TOKEN: ${JOBS_TO_PLATFORM_RANK_GRANT_TOKEN:?JOBS_TO_PLATFORM_RANK_GRANT_TOKEN is required}
      JOBS_TO_PLATFORM_BILLING_SETTLEMENT_TOKEN: ${JOBS_TO_PLATFORM_BILLING_SETTLEMENT_TOKEN:?JOBS_TO_PLATFORM_BILLING_SETTLEMENT_TOKEN is required}
      JOBS_TO_SEO_RANK_TOKEN: ${JOBS_TO_SEO_RANK_TOKEN:?JOBS_TO_SEO_RANK_TOKEN is required}
      JOBS_TO_SEO_RANK_RESULT_TOKEN: ${JOBS_TO_SEO_RANK_RESULT_TOKEN:?JOBS_TO_SEO_RANK_RESULT_TOKEN is required}
      JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN: ${JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN:?JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN is required}
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-false}
      OPERATIONAL_ALERT_TOKEN: ${OPERATIONAL_ALERT_TOKEN:?OPERATIONAL_ALERT_TOKEN is required}
      OPERATIONAL_ALERTS_INTERNAL_URL: http://backend-core:4004
      INTEGRATION_CREDENTIAL_KEYS: ${INTEGRATION_CREDENTIAL_KEYS:?INTEGRATION_CREDENTIAL_KEYS is required}
      INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION: ${INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION:?INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION is required}
      INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS: ${INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS:?INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS is required}
      INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION: ${INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION:?INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION is required}
      INTEGRATION_VALIDATION_TIMEOUT_MS: ${INTEGRATION_VALIDATION_TIMEOUT_MS:-10000}
      INTEGRATION_VALIDATION_LEASE_SECONDS: ${INTEGRATION_VALIDATION_LEASE_SECONDS:-120}
      INTEGRATION_VALIDATION_DISPATCH_SECONDS: ${INTEGRATION_VALIDATION_DISPATCH_SECONDS:-15}
      INTEGRATION_VALIDATION_CONCURRENCY: ${INTEGRATION_VALIDATION_CONCURRENCY:-1}
      PLATFORM_XMLSTOCK_ENABLED: ${PLATFORM_XMLSTOCK_ENABLED:-false}
      PLATFORM_XMLSTOCK_API_KEY: ${PLATFORM_XMLSTOCK_API_KEY:-}
      PLATFORM_XMLSTOCK_API_KEYS: ${PLATFORM_XMLSTOCK_API_KEYS:-}
      PLATFORM_XMLSTOCK_ACCOUNT_ID: ${PLATFORM_XMLSTOCK_ACCOUNT_ID:-}
      PLATFORM_XMLSTOCK_ACCOUNT_IDS: ${PLATFORM_XMLSTOCK_ACCOUNT_IDS:-}
      PLATFORM_ARSENKIN_ENABLED: ${PLATFORM_ARSENKIN_ENABLED:-false}
      PLATFORM_ARSENKIN_CLUSTERING_KEYWORD_LIMIT: ${PLATFORM_ARSENKIN_CLUSTERING_KEYWORD_LIMIT:-30000}
      PLATFORM_ARSENKIN_API_KEY: ${PLATFORM_ARSENKIN_API_KEY:-}
      PLATFORM_ARSENKIN_API_KEYS: ${PLATFORM_ARSENKIN_API_KEYS:-}
      CONNECTOR_RUNTIME_DISPATCH_INTERVAL_MS: ${CONNECTOR_RUNTIME_DISPATCH_INTERVAL_MS:-1000}
      RANK_CONNECTOR_CONCURRENCY: ${RANK_CONNECTOR_CONCURRENCY:-4}
      FREQUENCY_COLLECTION_CONCURRENCY: ${FREQUENCY_COLLECTION_CONCURRENCY:-4}
      KEYWORD_RESEARCH_CONCURRENCY: ${KEYWORD_RESEARCH_CONCURRENCY:-1}
      RANK_PROVIDER_SUBMIT_ENABLED: ${RANK_PROVIDER_SUBMIT_ENABLED:-true}
      RANK_PROVIDER_KILL_SWITCH_VERSION: ${RANK_PROVIDER_KILL_SWITCH_VERSION:-arsenkin-positions@4}
      RANK_PREPARATION_LEASE_SECONDS: ${RANK_PREPARATION_LEASE_SECONDS:-120}
      RANK_PREPARATION_DISPATCH_SECONDS: ${RANK_PREPARATION_DISPATCH_SECONDS:-15}
      RANK_RESULT_PERSISTENCE_DISPATCH_INTERVAL_MS: ${RANK_RESULT_PERSISTENCE_DISPATCH_INTERVAL_MS:-1000}
      RANK_PREPARATION_CONCURRENCY: ${RANK_PREPARATION_CONCURRENCY:-2}
      PLATFORM_API_URL: http://backend-core:4000
      PLATFORM_API_COMMAND_TIMEOUT_MS: ${PLATFORM_API_COMMAND_TIMEOUT_MS:-5000}
      SEO_DATA_URL: http://backend-core:4001
      CRAWL_CONTACT_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}/crawler
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-2}
      CRAWL_DISPATCH_SECONDS: ${CRAWL_DISPATCH_SECONDS:-15}
      CRAWL_LEASE_SECONDS: ${CRAWL_LEASE_SECONDS:-180}
      CRAWL_REQUEST_TIMEOUT_MS: ${CRAWL_REQUEST_TIMEOUT_MS:-20000}
      CRAWL_MAX_RESPONSE_BYTES: ${CRAWL_MAX_RESPONSE_BYTES:-2000000}
      CRAWL_MAX_REDIRECTS: ${CRAWL_MAX_REDIRECTS:-5}
      AUTH_EMAIL_EVENT_ENVIRONMENT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}
      AUTH_EMAIL_MAX_ATTEMPTS: ${AUTH_EMAIL_MAX_ATTEMPTS:-10}
      AUTH_EMAIL_LEASE_SECONDS: ${AUTH_EMAIL_LEASE_SECONDS:-120}
      AUTH_EMAIL_DISPATCH_MS: ${AUTH_EMAIL_DISPATCH_MS:-1000}
      AUTH_EMAIL_FETCH_EXPIRES_MS: ${AUTH_EMAIL_FETCH_EXPIRES_MS:-30000}
      AUTH_EMAIL_PUBLISH_TIMEOUT_MS: ${AUTH_EMAIL_PUBLISH_TIMEOUT_MS:-5000}
      AUTH_EMAIL_RETRY_BASE_MS: ${AUTH_EMAIL_RETRY_BASE_MS:-1000}
      AUTH_EMAIL_RETRY_MAX_MS: ${AUTH_EMAIL_RETRY_MAX_MS:-300000}
      AUTH_EMAIL_MAX_PAYLOAD_BYTES: ${AUTH_EMAIL_MAX_PAYLOAD_BYTES:-65536}
      AUTH_EMAIL_SHUTDOWN_GRACE_MS: ${AUTH_EMAIL_SHUTDOWN_GRACE_MS:-10000}
    expose:
      - "4002"
    networks:
      - internal
      - outbound
      - jobs-redis
    depends_on:
      jobs-runtime-db-permissions:
        condition: service_completed_successfully
      jobs-connector-db-permissions:
        condition: service_completed_successfully
      service-token-preflight:
        condition: service_completed_successfully
      redis-jobs:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-topology-provisioner:
        condition: service_completed_successfully
      backend-core:
        # Core readiness checks this service, so waiting for Core readiness here
        # would deadlock first startup. Core only needs to be running while both
        # backend services converge to ready.
        condition: service_started
    stop_grace_period: 75s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    restart: unless-stopped
    logging: *runtime-logging
    init: true
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        PACKAGE_NAME: "@seo-platform/frontend"
        PACKAGE_PATH: frontend
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
        WEB_WWW_REDIRECT_HOST: ${WEB_WWW_REDIRECT_HOST:-www.seonorita.ru}
        REALTIME_INTERNAL_URL: http://backend-core:4003
        NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-seo_csrf}
        NEXT_PUBLIC_TERMS_VERSION: ${TERMS_VERSION:?TERMS_VERSION is required}
        NEXT_PUBLIC_PRIVACY_VERSION: ${PRIVACY_VERSION:?PRIVACY_VERSION is required}
        NEXT_PUBLIC_MARKETING_VERSION: ${MARKETING_VERSION:?MARKETING_VERSION is required}
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: 3000
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
      WEB_WWW_REDIRECT_HOST: ${WEB_WWW_REDIRECT_HOST:-www.seonorita.ru}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      PLATFORM_API_INTERNAL_URL: http://backend-core:4000
      REALTIME_INTERNAL_URL: http://backend-core:4003
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-seo_access}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-seo_session}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-seo_csrf}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      LEGAL_DOCUMENTS_PUBLISHED: ${LEGAL_DOCUMENTS_PUBLISHED:-false}
      LEGAL_SELLER_NAME: ${LEGAL_SELLER_NAME:-}
      LEGAL_SELLER_INN: ${LEGAL_SELLER_INN:-}
      LEGAL_CONTACT_ADDRESS: ${LEGAL_CONTACT_ADDRESS:-}
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-false}
      OPERATIONAL_ALERT_TOKEN: ${OPERATIONAL_ALERT_TOKEN:?OPERATIONAL_ALERT_TOKEN is required}
      OPERATIONAL_ALERTS_INTERNAL_URL: http://backend-core:4004
    expose:
      - "3000"
    networks:
      - internal
      - edge
    depends_on:
      backend-core:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ru').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_jobs_data:
  nats_data:
  clamav_data:

networks:
  internal:
    internal: true
  jobs-redis:
    internal: true
  realtime-redis:
    internal: true
  edge:
  outbound:
    driver: bridge
