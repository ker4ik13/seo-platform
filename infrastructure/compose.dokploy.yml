        PACKAGE_NAME: "@seo-platform/backend-core-api"
    restart: "no"
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_PROVISIONER_USER:?NATS_PROVISIONER_USER is required}
      NATS_PASSWORD: ${NATS_PROVISIONER_PASSWORD:?NATS_PROVISIONER_PASSWORD is required}
      NATS_EVENT_ENVIRONMENT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}
    networks:
      - internal
    depends_on:
      service-token-preflight:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

