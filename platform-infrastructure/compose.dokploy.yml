name: ${COMPOSE_PROJECT_NAME:-seo-platform}

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  init: true
  networks:
    - internal
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy

x-common-backend-env: &common-backend-env
  NODE_ENV: production
  SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
  NATS_URL: nats://nats:4222

x-generic-nats-runtime-env: &generic-nats-runtime-env
  NATS_USER: ${NATS_RUNTIME_USER:?NATS_RUNTIME_USER is required}
  NATS_PASSWORD: ${NATS_RUNTIME_PASSWORD:?NATS_RUNTIME_PASSWORD is required}

x-jobs-runtime-env: &jobs-runtime-env
  NODE_ENV: production
  SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
  DATABASE_URL: postgresql://jobs_runtime:${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}@postgres:5432/jobs_db

x-jobs-s3-env: &jobs-s3-env
  S3_ENABLED: ${S3_ENABLED:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-ru-central1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}

x-jobs-upload-command-env: &jobs-upload-command-env
  UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-5368709120}
  UPLOAD_PART_SIZE_BYTES: ${UPLOAD_PART_SIZE_BYTES:-8388608}
  UPLOAD_EXPIRES_HOURS: ${UPLOAD_EXPIRES_HOURS:-24}

x-jobs-inspection-env: &jobs-inspection-env
  UPLOAD_INSPECTION_LEASE_MINUTES: ${UPLOAD_INSPECTION_LEASE_MINUTES:-30}
  UPLOAD_INSPECTION_DISPATCH_SECONDS: ${UPLOAD_INSPECTION_DISPATCH_SECONDS:-30}
  UPLOAD_INSPECTION_HEARTBEAT_SECONDS: ${UPLOAD_INSPECTION_HEARTBEAT_SECONDS:-60}
  UPLOAD_INSPECTION_CONCURRENCY: ${UPLOAD_INSPECTION_CONCURRENCY:-2}
  MALWARE_SCANNER_ENABLED: "true"
  MALWARE_SCANNER_HOST: clamav
  MALWARE_SCANNER_PORT: 3310
  MALWARE_SCANNER_CONNECT_TIMEOUT_MS: ${MALWARE_SCANNER_CONNECT_TIMEOUT_MS:-5000}
  MALWARE_SCANNER_SCAN_TIMEOUT_MS: ${MALWARE_SCANNER_SCAN_TIMEOUT_MS:-900000}

x-jobs-import-env: &jobs-import-env
  IMPORT_PARSE_LEASE_MINUTES: ${IMPORT_PARSE_LEASE_MINUTES:-30}
  IMPORT_PARSE_DISPATCH_SECONDS: ${IMPORT_PARSE_DISPATCH_SECONDS:-30}
  IMPORT_PARSE_HEARTBEAT_SECONDS: ${IMPORT_PARSE_HEARTBEAT_SECONDS:-30}
  IMPORT_PARSE_CONCURRENCY: ${IMPORT_PARSE_CONCURRENCY:-2}
  IMPORT_STAGING_BATCH_ROWS: ${IMPORT_STAGING_BATCH_ROWS:-1000}
  IMPORT_PREVIEW_ROWS: ${IMPORT_PREVIEW_ROWS:-20}
  IMPORT_PUBLISH_BATCH_ROWS: ${IMPORT_PUBLISH_BATCH_ROWS:-200}

x-jobs-seo-data-env: &jobs-seo-data-env
  SEO_DATA_COMMAND_TIMEOUT_MS: ${SEO_DATA_COMMAND_TIMEOUT_MS:-60000}
  SEO_DATA_URL: http://seo-data:4001
  JOBS_TO_SEO_DATA_TOKEN: ${JOBS_TO_SEO_DATA_TOKEN:?JOBS_TO_SEO_DATA_TOKEN is required}

x-auth-email-runtime-env: &auth-email-runtime-env
  EMAIL_ENABLED: "true"
  EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
  EMAIL_MESSAGE_ID_DOMAIN: ${AUTH_EMAIL_MESSAGE_ID_DOMAIN:?AUTH_EMAIL_MESSAGE_ID_DOMAIN is required}
  SMTP_HOST: ${AUTH_EMAIL_SMTP_HOST:?AUTH_EMAIL_SMTP_HOST is required}
  SMTP_PORT: ${AUTH_EMAIL_SMTP_PORT:-587}
  SMTP_SECURE: ${AUTH_EMAIL_SMTP_SECURE:-false}
  SMTP_USER: ${AUTH_EMAIL_SMTP_USER:?AUTH_EMAIL_SMTP_USER is required}
  SMTP_PASSWORD: ${AUTH_EMAIL_SMTP_PASSWORD:?AUTH_EMAIL_SMTP_PASSWORD is required}
  SMTP_CONNECTION_TIMEOUT_MS: ${AUTH_EMAIL_SMTP_CONNECTION_TIMEOUT_MS:-5000}
  SMTP_SOCKET_TIMEOUT_MS: ${AUTH_EMAIL_SMTP_SOCKET_TIMEOUT_MS:-10000}

x-integration-credential-management-env: &integration-credential-management-env
  INTEGRATION_CREDENTIAL_ROLE: MANAGEMENT
  PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN: ${PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN:?PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN is required}
  INTEGRATION_CREDENTIAL_KEYS: ${INTEGRATION_CREDENTIAL_KEYS:?INTEGRATION_CREDENTIAL_KEYS is required}
  INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION: ${INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION:?INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION is required}
  INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS: ${INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS:?INTEGRATION_CREDENTIAL_FINGERPRINT_KEYS is required}
  INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION: ${INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION:?INTEGRATION_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_VERSION is required}

x-integration-credential-execution-env: &integration-credential-execution-env
  INTEGRATION_CREDENTIAL_ROLE: EXECUTION
  INTEGRATION_CREDENTIAL_KEYS: ${INTEGRATION_CREDENTIAL_KEYS:?INTEGRATION_CREDENTIAL_KEYS is required}
  INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION: ${INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION:?INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION is required}

x-redis-defaults: &redis-defaults
  image: redis:8.8.1-alpine3.23
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ["no-new-privileges:true"]
  depends_on:
    service-token-preflight:
      condition: service_completed_successfully
  healthcheck:
    test:
      [
        "CMD",
        "redis-cli",
        "-e",
        "--user",
        "seo_health",
        "--pass",
        "health",
        "--no-auth-warning",
        "ping"
      ]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

x-service-runtime-permission-defaults: &service-runtime-permission-defaults
  image: postgres:18.3-alpine3.23
  restart: "no"
  init: true
  command:
    [
      "/bin/sh",
      "/permissions/provision-service-runtime-role.sh"
    ]
  volumes:
    - ./postgres/permissions/service-runtime.sql:/permissions/service-runtime.sql:ro
    - ./postgres/permissions/provision-service-runtime-role.sh:/permissions/provision-service-runtime-role.sh:ro
  networks:
    - internal

services:
  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    shm_size: 256mb
    entrypoint:
      ["/bin/sh", "/postgres-config/start-postgres.sh"]
    command:
      ["postgres", "-c", "hba_file=/tmp/seo-platform-pg_hba.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      JOBS_CONNECTOR_DATABASE_USER: jobs_connector
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/config/start-postgres.sh:/postgres-config/start-postgres.sh:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  service-database-roles:
    image: postgres:18.3-alpine3.23
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PLATFORM_DATABASE_OWNER_PASSWORD: ${PLATFORM_DATABASE_OWNER_PASSWORD:?PLATFORM_DATABASE_OWNER_PASSWORD is required}
      PLATFORM_DATABASE_PASSWORD: ${PLATFORM_DATABASE_PASSWORD:?PLATFORM_DATABASE_PASSWORD is required}
      SEO_DATABASE_OWNER_PASSWORD: ${SEO_DATABASE_OWNER_PASSWORD:?SEO_DATABASE_OWNER_PASSWORD is required}
      SEO_DATABASE_PASSWORD: ${SEO_DATABASE_PASSWORD:?SEO_DATABASE_PASSWORD is required}
      JOBS_DATABASE_OWNER_PASSWORD: ${JOBS_DATABASE_OWNER_PASSWORD:?JOBS_DATABASE_OWNER_PASSWORD is required}
      JOBS_DATABASE_PASSWORD: ${JOBS_DATABASE_PASSWORD:?JOBS_DATABASE_PASSWORD is required}
      JOBS_RANK_DATABASE_PASSWORD: ${JOBS_RANK_DATABASE_PASSWORD:?JOBS_RANK_DATABASE_PASSWORD is required}
      JOBS_AUTH_EMAIL_DATABASE_PASSWORD: ${JOBS_AUTH_EMAIL_DATABASE_PASSWORD:?JOBS_AUTH_EMAIL_DATABASE_PASSWORD is required}
      REALTIME_DATABASE_OWNER_PASSWORD: ${REALTIME_DATABASE_OWNER_PASSWORD:?REALTIME_DATABASE_OWNER_PASSWORD is required}
      REALTIME_DATABASE_PASSWORD: ${REALTIME_DATABASE_PASSWORD:?REALTIME_DATABASE_PASSWORD is required}
      DIRECTUS_DATABASE_PASSWORD: ${DIRECTUS_DATABASE_PASSWORD:?DIRECTUS_DATABASE_PASSWORD is required}
    command:
      [
        "/bin/sh",
        "/database-roles/provision-service-database-roles.sh"
      ]
    volumes:
      - ./postgres/roles:/database-roles:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  service-token-preflight:
    image: postgres:18.3-alpine3.23
    restart: "no"
    init: true
    user: "65534:65534"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/security/validate-service-tokens.sh"]
    environment:
      PLATFORM_API_TO_SEO_DATA_TOKEN: ${PLATFORM_API_TO_SEO_DATA_TOKEN:?PLATFORM_API_TO_SEO_DATA_TOKEN is required}
      PLATFORM_API_TO_JOBS_TOKEN: ${PLATFORM_API_TO_JOBS_TOKEN:?PLATFORM_API_TO_JOBS_TOKEN is required}
      JOBS_TO_SEO_DATA_TOKEN: ${JOBS_TO_SEO_DATA_TOKEN:?JOBS_TO_SEO_DATA_TOKEN is required}
      PLATFORM_API_TO_REALTIME_TOKEN: ${PLATFORM_API_TO_REALTIME_TOKEN:?PLATFORM_API_TO_REALTIME_TOKEN is required}
      PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN: ${PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN:?PLATFORM_API_TO_JOBS_CREDENTIAL_TOKEN is required}
      PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN: ${PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN:?PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN is required}
      JOBS_TO_SEO_RANK_TOKEN: ${JOBS_TO_SEO_RANK_TOKEN:?JOBS_TO_SEO_RANK_TOKEN is required}
      JOBS_TO_SEO_RANK_RESULT_TOKEN: ${JOBS_TO_SEO_RANK_RESULT_TOKEN:?JOBS_TO_SEO_RANK_RESULT_TOKEN is required}
      JOBS_TO_PLATFORM_RANK_GRANT_TOKEN: ${JOBS_TO_PLATFORM_RANK_GRANT_TOKEN:?JOBS_TO_PLATFORM_RANK_GRANT_TOKEN is required}
      JOBS_TO_PLATFORM_AUTOMATION_TOKEN: ${JOBS_TO_PLATFORM_AUTOMATION_TOKEN:?JOBS_TO_PLATFORM_AUTOMATION_TOKEN is required}
      JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN: ${JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN:?JOBS_TO_PLATFORM_AUTH_EMAIL_TOKEN is required}
      RANK_HISTORY_CURSOR_KEY: ${RANK_HISTORY_CURSOR_KEY:?RANK_HISTORY_CURSOR_KEY is required}
      REDIS_JOBS_API_PASSWORD: ${REDIS_JOBS_API_PASSWORD:?REDIS_JOBS_API_PASSWORD is required}
      REDIS_JOBS_SYSTEM_PASSWORD: ${REDIS_JOBS_SYSTEM_PASSWORD:?REDIS_JOBS_SYSTEM_PASSWORD is required}
      REDIS_JOBS_INSPECTION_PASSWORD: ${REDIS_JOBS_INSPECTION_PASSWORD:?REDIS_JOBS_INSPECTION_PASSWORD is required}
      REDIS_JOBS_IMPORT_PASSWORD: ${REDIS_JOBS_IMPORT_PASSWORD:?REDIS_JOBS_IMPORT_PASSWORD is required}
      REDIS_JOBS_RANK_PASSWORD: ${REDIS_JOBS_RANK_PASSWORD:?REDIS_JOBS_RANK_PASSWORD is required}
      REDIS_JOBS_CRAWL_PASSWORD: ${REDIS_JOBS_CRAWL_PASSWORD:?REDIS_JOBS_CRAWL_PASSWORD is required}
      REDIS_JOBS_CONNECTOR_PASSWORD: ${REDIS_JOBS_CONNECTOR_PASSWORD:?REDIS_JOBS_CONNECTOR_PASSWORD is required}
      REDIS_REALTIME_PASSWORD: ${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}
      REDIS_DIRECTUS_PASSWORD: ${REDIS_DIRECTUS_PASSWORD:?REDIS_DIRECTUS_PASSWORD is required}
      NATS_RUNTIME_USER: ${NATS_RUNTIME_USER:?NATS_RUNTIME_USER is required}
      NATS_RUNTIME_PASSWORD: ${NATS_RUNTIME_PASSWORD:?NATS_RUNTIME_PASSWORD is required}
      NATS_RUNTIME_PASSWORD_HASH: ${NATS_RUNTIME_PASSWORD_HASH:?NATS_RUNTIME_PASSWORD_HASH is required}
      NATS_PLATFORM_PUBLISHER_USER: ${NATS_PLATFORM_PUBLISHER_USER:?NATS_PLATFORM_PUBLISHER_USER is required}
      NATS_PLATFORM_PUBLISHER_PASSWORD: ${NATS_PLATFORM_PUBLISHER_PASSWORD:?NATS_PLATFORM_PUBLISHER_PASSWORD is required}
      NATS_PLATFORM_PUBLISHER_PASSWORD_HASH: ${NATS_PLATFORM_PUBLISHER_PASSWORD_HASH:?NATS_PLATFORM_PUBLISHER_PASSWORD_HASH is required}
      NATS_REALTIME_CONSUMER_USER: ${NATS_REALTIME_CONSUMER_USER:?NATS_REALTIME_CONSUMER_USER is required}
      NATS_REALTIME_CONSUMER_PASSWORD: ${NATS_REALTIME_CONSUMER_PASSWORD:?NATS_REALTIME_CONSUMER_PASSWORD is required}
      NATS_REALTIME_CONSUMER_PASSWORD_HASH: ${NATS_REALTIME_CONSUMER_PASSWORD_HASH:?NATS_REALTIME_CONSUMER_PASSWORD_HASH is required}
      NATS_AUTH_EMAIL_CONSUMER_USER: ${NATS_AUTH_EMAIL_CONSUMER_USER:?NATS_AUTH_EMAIL_CONSUMER_USER is required}
      NATS_AUTH_EMAIL_CONSUMER_PASSWORD: ${NATS_AUTH_EMAIL_CONSUMER_PASSWORD:?NATS_AUTH_EMAIL_CONSUMER_PASSWORD is required}
      NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH: ${NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH:?NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH is required}
      AUTH_EMAIL_SMTP_USER: ${AUTH_EMAIL_SMTP_USER:?AUTH_EMAIL_SMTP_USER is required}
      AUTH_EMAIL_SMTP_PASSWORD: ${AUTH_EMAIL_SMTP_PASSWORD:?AUTH_EMAIL_SMTP_PASSWORD is required}
      DIRECTUS_SMTP_USER: ${DIRECTUS_SMTP_USER:-}
      DIRECTUS_SMTP_PASSWORD: ${DIRECTUS_SMTP_PASSWORD:-}
      NATS_PROVISIONER_USER: ${NATS_PROVISIONER_USER:?NATS_PROVISIONER_USER is required}
      NATS_PROVISIONER_PASSWORD: ${NATS_PROVISIONER_PASSWORD:?NATS_PROVISIONER_PASSWORD is required}
      NATS_PROVISIONER_PASSWORD_HASH: ${NATS_PROVISIONER_PASSWORD_HASH:?NATS_PROVISIONER_PASSWORD_HASH is required}
    volumes:
      - ./security/validate-service-tokens.sh:/security/validate-service-tokens.sh:ro

  redis-jobs:
    <<: *redis-defaults
    command: ["/bin/sh", "/redis/start-redis.sh", "jobs"]
    environment:
      REDIS_JOBS_API_PASSWORD: ${REDIS_JOBS_API_PASSWORD:?REDIS_JOBS_API_PASSWORD is required}
      REDIS_JOBS_SYSTEM_PASSWORD: ${REDIS_JOBS_SYSTEM_PASSWORD:?REDIS_JOBS_SYSTEM_PASSWORD is required}
      REDIS_JOBS_INSPECTION_PASSWORD: ${REDIS_JOBS_INSPECTION_PASSWORD:?REDIS_JOBS_INSPECTION_PASSWORD is required}
      REDIS_JOBS_IMPORT_PASSWORD: ${REDIS_JOBS_IMPORT_PASSWORD:?REDIS_JOBS_IMPORT_PASSWORD is required}
      REDIS_JOBS_RANK_PASSWORD: ${REDIS_JOBS_RANK_PASSWORD:?REDIS_JOBS_RANK_PASSWORD is required}
      REDIS_JOBS_CRAWL_PASSWORD: ${REDIS_JOBS_CRAWL_PASSWORD:?REDIS_JOBS_CRAWL_PASSWORD is required}
      REDIS_JOBS_CONNECTOR_PASSWORD: ${REDIS_JOBS_CONNECTOR_PASSWORD:?REDIS_JOBS_CONNECTOR_PASSWORD is required}
    volumes:
      - redis_jobs_data:/data
      - ./redis:/redis:ro
    tmpfs:
      - /run/redis-runtime:rw,noexec,nosuid,size=1m,mode=0700
    networks:
      - jobs-redis
    cpus: "1.0"
    mem_limit: 768M
    pids_limit: 128

  redis-realtime:
    <<: *redis-defaults
    command: ["/bin/sh", "/redis/start-redis.sh", "realtime"]
    environment:
      REDIS_REALTIME_PASSWORD: ${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}
    volumes:
      - ./redis:/redis:ro
    tmpfs:
      - /run/redis-runtime:rw,noexec,nosuid,size=1m,mode=0700
      - /data:rw,noexec,nosuid,size=16m,mode=0750
    networks:
      - realtime-redis
    cpus: "0.5"
    mem_limit: 192M
    pids_limit: 64

  redis-directus:
    <<: *redis-defaults
    command: ["/bin/sh", "/redis/start-redis.sh", "directus"]
    environment:
      REDIS_DIRECTUS_PASSWORD: ${REDIS_DIRECTUS_PASSWORD:?REDIS_DIRECTUS_PASSWORD is required}
    volumes:
      - ./redis:/redis:ro
    tmpfs:
      - /run/redis-runtime:rw,noexec,nosuid,size=1m,mode=0700
      - /data:rw,noexec,nosuid,size=16m,mode=0750
    networks:
      - directus-redis
    cpus: "0.5"
    mem_limit: 320M
    pids_limit: 64

  nats:
    image: nats:2.12.12-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/nats/start-nats.sh"]
    environment:
      NATS_RUNTIME_USER: ${NATS_RUNTIME_USER:?NATS_RUNTIME_USER is required}
      NATS_RUNTIME_PASSWORD_HASH: ${NATS_RUNTIME_PASSWORD_HASH:?NATS_RUNTIME_PASSWORD_HASH is required}
      NATS_PLATFORM_PUBLISHER_USER: ${NATS_PLATFORM_PUBLISHER_USER:?NATS_PLATFORM_PUBLISHER_USER is required}
      NATS_PLATFORM_PUBLISHER_PASSWORD_HASH: ${NATS_PLATFORM_PUBLISHER_PASSWORD_HASH:?NATS_PLATFORM_PUBLISHER_PASSWORD_HASH is required}
      NATS_REALTIME_CONSUMER_USER: ${NATS_REALTIME_CONSUMER_USER:?NATS_REALTIME_CONSUMER_USER is required}
      NATS_REALTIME_CONSUMER_PASSWORD_HASH: ${NATS_REALTIME_CONSUMER_PASSWORD_HASH:?NATS_REALTIME_CONSUMER_PASSWORD_HASH is required}
      NATS_AUTH_EMAIL_CONSUMER_USER: ${NATS_AUTH_EMAIL_CONSUMER_USER:?NATS_AUTH_EMAIL_CONSUMER_USER is required}
      NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH: ${NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH:?NATS_AUTH_EMAIL_CONSUMER_PASSWORD_HASH is required}
      NATS_PROVISIONER_USER: ${NATS_PROVISIONER_USER:?NATS_PROVISIONER_USER is required}
      NATS_PROVISIONER_PASSWORD_HASH: ${NATS_PROVISIONER_PASSWORD_HASH:?NATS_PROVISIONER_PASSWORD_HASH is required}
      NATS_IDENTITY_EVENT_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.identity.session-family.revoked.v1
      NATS_IDENTITY_EVENT_DLQ_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.dlq.realtime.identity.session-family.revoked.v1
      NATS_EMAIL_VERIFICATION_EVENT_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.email.identity.email-verification.requested.v1
      NATS_PASSWORD_RESET_EVENT_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.email.identity.password-reset.requested.v1
      NATS_WORKSPACE_INVITE_EVENT_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.email.workspace.invite.requested.v1
      NATS_NPD_RECEIPT_EVENT_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.email.billing.npd-receipt.delivery-requested.v1
      NATS_AUTH_EMAIL_DLQ_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.dlq.jobs.transactional-email.v1
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./nats/start-nats.sh:/etc/nats/start-nats.sh:ro
    read_only: true
    tmpfs:
      - /run/nats-runtime:rw,noexec,nosuid,size=1m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    depends_on:
      service-token-preflight:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  nats-topology-provisioner:
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/backend.Dockerfile
      target: nats-provisioner
      args:
        PACKAGE_NAME: "@seo-platform/platform-api"
    restart: "no"
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_PROVISIONER_USER:?NATS_PROVISIONER_USER is required}
      NATS_PASSWORD: ${NATS_PROVISIONER_PASSWORD:?NATS_PROVISIONER_PASSWORD is required}
      NATS_EVENT_ENVIRONMENT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}
    networks:
      - internal
    depends_on:
      service-token-preflight:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    profiles:
      - inspection
    restart: unless-stopped
    init: true
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

  platform-api-migrate:
    <<: *backend-defaults
    restart: "no"
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/backend.Dockerfile
      target: migration
