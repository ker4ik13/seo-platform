      PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN: ${PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN:?PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN is required}
      CORS_ORIGINS: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required},${ADMIN_PUBLIC_URL:?ADMIN_PUBLIC_URL is required}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
      YOOKASSA_ENABLED: ${YOOKASSA_ENABLED:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
