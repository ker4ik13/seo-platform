    mem_limit: "${JOBS_RANK_MEMORY_LIMIT:-512M}"
    pids_limit: ${JOBS_RANK_PIDS_LIMIT:-128}
    networks:
      - internal
      - jobs-redis
    depends_on:
      jobs-runtime-db-permissions:
        condition: service_completed_successfully
      service-token-preflight:
        condition: service_completed_successfully
      redis-jobs:
        condition: service_healthy
      seo-data:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -o args | grep -q '[r]ank-worker.main.js'"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  crawl-worker:
    <<: *backend-defaults
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/backend.Dockerfile
      target: runtime
      args:
        PACKAGE_NAME: "@seo-platform/jobs-integrations"
    command: ["node", "dist/crawl-worker.main.js"]
    environment:
      <<: [*jobs-runtime-env, *jobs-seo-data-env]
      DATABASE_POOL_MAX: ${JOBS_CRAWL_DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://seo_jobs_crawl:${REDIS_JOBS_CRAWL_PASSWORD:?REDIS_JOBS_CRAWL_PASSWORD is required}@redis-jobs:6379
      CRAWL_CONTACT_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}/crawler
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-2}
      CRAWL_DISPATCH_SECONDS: ${CRAWL_DISPATCH_SECONDS:-15}
      CRAWL_LEASE_SECONDS: ${CRAWL_LEASE_SECONDS:-180}
      CRAWL_REQUEST_TIMEOUT_MS: ${CRAWL_REQUEST_TIMEOUT_MS:-20000}
      CRAWL_MAX_RESPONSE_BYTES: ${CRAWL_MAX_RESPONSE_BYTES:-2000000}
      CRAWL_MAX_REDIRECTS: ${CRAWL_MAX_REDIRECTS:-5}
    cpus: "${JOBS_CRAWL_CPU_LIMIT:-1.0}"
    mem_limit: "${JOBS_CRAWL_MEMORY_LIMIT:-512M}"
    pids_limit: ${JOBS_CRAWL_PIDS_LIMIT:-128}
    networks:
      - internal
      - outbound
      - jobs-redis
    depends_on:
      jobs-runtime-db-permissions:
        condition: service_completed_successfully
      service-token-preflight:
        condition: service_completed_successfully
      redis-jobs:
        condition: service_healthy
      seo-data:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -o args | grep -q '[c]rawl-worker.main.js'"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  connector-worker:
    <<: *backend-defaults
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/backend.Dockerfile
      target: runtime
      args:
        PACKAGE_NAME: "@seo-platform/jobs-integrations"
    command: ["node", "dist/connector-worker.main.js"]
    environment:
      <<: *integration-credential-execution-env
      NODE_ENV: production
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DATABASE_URL: postgresql://jobs_connector:${JOBS_CONNECTOR_DATABASE_PASSWORD:?JOBS_CONNECTOR_DATABASE_PASSWORD is required}@postgres:5432/jobs_db
      REDIS_URL: redis://seo_jobs_connector:${REDIS_JOBS_CONNECTOR_PASSWORD:?REDIS_JOBS_CONNECTOR_PASSWORD is required}@redis-jobs:6379
      DATABASE_POOL_MAX: ${JOBS_CONNECTOR_DATABASE_POOL_MAX:-10}
      INTEGRATION_VALIDATION_TIMEOUT_MS: ${INTEGRATION_VALIDATION_TIMEOUT_MS:-10000}
      INTEGRATION_VALIDATION_LEASE_SECONDS: ${INTEGRATION_VALIDATION_LEASE_SECONDS:-120}
      INTEGRATION_VALIDATION_DISPATCH_SECONDS: ${INTEGRATION_VALIDATION_DISPATCH_SECONDS:-15}
      INTEGRATION_VALIDATION_CONCURRENCY: ${INTEGRATION_VALIDATION_CONCURRENCY:-2}
      RANK_PROVIDER_SUBMIT_ENABLED: ${RANK_PROVIDER_SUBMIT_ENABLED:-true}
      RANK_PROVIDER_KILL_SWITCH_VERSION: ${RANK_PROVIDER_KILL_SWITCH_VERSION:-arsenkin-positions@2}
    networks:
      - internal
      - outbound
      - jobs-redis
    depends_on:
      jobs-connector-db-permissions:
        condition: service_completed_successfully
      redis-jobs:
        condition: service_healthy

  realtime:
    <<: *backend-defaults
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/backend.Dockerfile
      target: runtime
      args:
        PACKAGE_NAME: "@seo-platform/realtime"
    environment:
      <<: *common-backend-env
      NATS_USER: ${NATS_REALTIME_CONSUMER_USER:?NATS_REALTIME_CONSUMER_USER is required}
      NATS_PASSWORD: ${NATS_REALTIME_CONSUMER_PASSWORD:?NATS_REALTIME_CONSUMER_PASSWORD is required}
      NATS_EVENT_CONSUMER_ENABLED: "true"
      NATS_EVENT_ENVIRONMENT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}
      NATS_EVENT_STREAM: IDENTITY_EVENTS
      NATS_EVENT_CONSUMER_DURABLE: realtime_session_family_revoked_v1
      NATS_EVENT_DLQ_STREAM: DOMAIN_EVENTS_DLQ
      NATS_EVENT_DLQ_SUBJECT: ${NATS_EVENT_ENVIRONMENT:?NATS_EVENT_ENVIRONMENT is required}.dlq.realtime.identity.session-family.revoked.v1
      NATS_EVENT_FETCH_EXPIRES_MS: ${NATS_EVENT_FETCH_EXPIRES_MS:-30000}
      NATS_EVENT_MAX_ATTEMPTS: ${NATS_EVENT_MAX_ATTEMPTS:-10}
      NATS_EVENT_RETRY_BASE_MS: ${NATS_EVENT_RETRY_BASE_MS:-1000}
      NATS_EVENT_RETRY_MAX_MS: ${NATS_EVENT_RETRY_MAX_MS:-300000}
      NATS_EVENT_PUBLISH_TIMEOUT_MS: ${NATS_EVENT_PUBLISH_TIMEOUT_MS:-5000}
      NATS_EVENT_MAX_PAYLOAD_BYTES: ${NATS_EVENT_MAX_PAYLOAD_BYTES:-65536}
      NATS_EVENT_SHUTDOWN_GRACE_MS: ${NATS_EVENT_SHUTDOWN_GRACE_MS:-10000}
      BIND_ADDRESS: 0.0.0.0
      PORT: 4003
      DATABASE_URL: postgresql://realtime_runtime:${REALTIME_DATABASE_PASSWORD:?REALTIME_DATABASE_PASSWORD is required}@postgres:5432/realtime_db
      DATABASE_POOL_MAX: ${REALTIME_DATABASE_POOL_MAX:-20}
      REDIS_URL: redis://seo_realtime:${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}@redis-realtime:6379
      WEB_ORIGINS: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
      PLATFORM_API_TO_REALTIME_TOKEN: ${PLATFORM_API_TO_REALTIME_TOKEN:?PLATFORM_API_TO_REALTIME_TOKEN is required}
      PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN: ${PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN:?PLATFORM_API_TO_REALTIME_NOTIFICATION_TOKEN is required}
      WEB_PUSH_REGISTRATION_ENABLED: ${WEB_PUSH_REGISTRATION_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_KEY_VERSION: ${WEB_PUSH_VAPID_KEY_VERSION:-}
      WEB_PUSH_ENDPOINT_ORIGINS: ${WEB_PUSH_ENDPOINT_ORIGINS:-}
      WEB_PUSH_SUBSCRIPTION_KEYS: ${WEB_PUSH_SUBSCRIPTION_KEYS:-}
      WEB_PUSH_ACTIVE_SUBSCRIPTION_KEY_VERSION: ${WEB_PUSH_ACTIVE_SUBSCRIPTION_KEY_VERSION:-}
      WEB_PUSH_FINGERPRINT_KEYS: ${WEB_PUSH_FINGERPRINT_KEYS:-}
      WEB_PUSH_ACTIVE_FINGERPRINT_KEY_VERSION: ${WEB_PUSH_ACTIVE_FINGERPRINT_KEY_VERSION:-}
      WEB_PUSH_MAX_ACTIVE_DEVICES: ${WEB_PUSH_MAX_ACTIVE_DEVICES:-20}
    expose:
      - "4003"
    networks:
      - internal
      - edge
      - realtime-redis
    depends_on:
      realtime-runtime-db-permissions:
        condition: service_completed_successfully
      service-token-preflight:
        condition: service_completed_successfully
      redis-realtime:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-topology-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4003/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    restart: unless-stopped
    init: true
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/web.Dockerfile
      args:
        PACKAGE_NAME: "@seo-platform/web"
        PACKAGE_PATH: platform-web
        NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
        NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-seo_csrf}
        NEXT_PUBLIC_TERMS_VERSION: ${TERMS_VERSION:?TERMS_VERSION is required}
        NEXT_PUBLIC_PRIVACY_VERSION: ${PRIVACY_VERSION:?PRIVACY_VERSION is required}
        NEXT_PUBLIC_MARKETING_VERSION: ${MARKETING_VERSION:?MARKETING_VERSION is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL}
      NEXT_PUBLIC_PLATFORM_API_URL: ${API_PUBLIC_URL}
      PLATFORM_API_INTERNAL_URL: http://platform-api:4000
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-seo_access}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-seo_session}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-seo_csrf}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_READ_TOKEN: ${DIRECTUS_READ_TOKEN:-}
    expose:
      - "3000"
    networks:
      - internal
      - edge
    depends_on:
      platform-api:
        condition: service_healthy

  admin:
    restart: unless-stopped
    init: true
    build:
      context: ..
      dockerfile: platform-infrastructure/docker/web.Dockerfile
      args:
        PACKAGE_NAME: "@seo-platform/admin"
        PACKAGE_PATH: platform-admin
    environment:
      NODE_ENV: production
      PORT: 3002
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:?ADMIN_PUBLIC_URL is required}
      PLATFORM_API_INTERNAL_URL: http://platform-api:4000
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-seo_access}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-seo_session}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-seo_csrf}
    expose:
      - "3002"
    networks:
      - internal
      - edge
    depends_on:
      platform-api:
        condition: service_healthy

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    environment:
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?DIRECTUS_ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD is required}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus_db
      DB_USER: directus_runtime_owner
      DB_PASSWORD: ${DIRECTUS_DATABASE_PASSWORD:?DIRECTUS_DATABASE_PASSWORD is required}
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      CACHE_NAMESPACE: seo-platform:directus:v1
      CACHE_AUTO_PURGE: "true"
      REDIS: redis://seo_directus:${REDIS_DIRECTUS_PASSWORD:?REDIS_DIRECTUS_PASSWORD is required}@redis-directus:6379
      STORAGE_LOCATIONS: media
      STORAGE_MEDIA_DRIVER: ${DIRECTUS_STORAGE_DRIVER:-local}
      STORAGE_MEDIA_ROOT: /directus/uploads
      STORAGE_MEDIA_KEY: ${S3_ACCESS_KEY_ID:-}
      STORAGE_MEDIA_SECRET: ${S3_SECRET_ACCESS_KEY:-}
      STORAGE_MEDIA_BUCKET: ${S3_BUCKET_CMS:-}
      STORAGE_MEDIA_REGION: ${S3_REGION:-ru-central1}
      STORAGE_MEDIA_ENDPOINT: ${S3_ENDPOINT:-}
      STORAGE_MEDIA_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      EMAIL_TRANSPORT: ${DIRECTUS_EMAIL_TRANSPORT:-sendmail}
      EMAIL_FROM: ${DIRECTUS_EMAIL_FROM:-}
      EMAIL_SMTP_HOST: ${DIRECTUS_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${DIRECTUS_SMTP_PORT:-587}
      EMAIL_SMTP_SECURE: ${DIRECTUS_SMTP_SECURE:-false}
      EMAIL_SMTP_USER: ${DIRECTUS_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${DIRECTUS_SMTP_PASSWORD:-}
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    expose:
      - "8055"
    networks:
      - internal
      - edge
      - directus-redis
    depends_on:
      service-database-roles:
        condition: service_completed_successfully
      redis-directus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8055/server/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  postgres_data:
  redis_jobs_data:
  nats_data:
  directus_uploads:
  directus_extensions:
  clamav_data:

networks:
  internal:
    internal: true
  jobs-redis:
    internal: true
  realtime-redis:
    internal: true
  directus-redis:
    internal: true
  edge:
  outbound:
    driver: bridge
