port: 4222
http_port: 8222
max_payload: 64KB

jetstream {
  store_dir: "/data"
  max_mem_store: 64MB
  max_file_store: 1GB
}

authorization {
  timeout: 2
  default_permissions: {
    publish: { deny: [">"] }
    subscribe: { deny: [">"] }
  }
  users: [
    {
      user: "__NATS_RUNTIME_USER__"
      password: "__NATS_RUNTIME_PASSWORD_HASH__"
      permissions: {
        publish: { deny: [">"] }
        subscribe: { deny: [">"] }
      }
    }
    {
      user: "__NATS_PLATFORM_PUBLISHER_USER__"
      password: "__NATS_PLATFORM_PUBLISHER_PASSWORD_HASH__"
      permissions: {
        publish: {
          allow: [
            "__NATS_IDENTITY_EVENT_SUBJECT__",
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.IDENTITY_EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: "__NATS_REALTIME_CONSUMER_USER__"
      password: "__NATS_REALTIME_CONSUMER_PASSWORD_HASH__"
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.IDENTITY_EVENTS",
            "$JS.API.STREAM.INFO.DOMAIN_EVENTS_DLQ",
            "$JS.API.CONSUMER.INFO.IDENTITY_EVENTS.realtime_session_family_revoked_v1",
            "$JS.API.CONSUMER.MSG.NEXT.IDENTITY_EVENTS.realtime_session_family_revoked_v1",
            "$JS.ACK.IDENTITY_EVENTS.realtime_session_family_revoked_v1.>",
            "__NATS_IDENTITY_EVENT_DLQ_SUBJECT__"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: "__NATS_PROVISIONER_USER__"
      password: "__NATS_PROVISIONER_PASSWORD_HASH__"
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.IDENTITY_EVENTS",
            "$JS.API.STREAM.CREATE.IDENTITY_EVENTS",
            "$JS.API.STREAM.UPDATE.IDENTITY_EVENTS",
            "$JS.API.STREAM.INFO.DOMAIN_EVENTS_DLQ",
            "$JS.API.STREAM.CREATE.DOMAIN_EVENTS_DLQ",
            "$JS.API.STREAM.UPDATE.DOMAIN_EVENTS_DLQ",
            "$JS.API.CONSUMER.INFO.IDENTITY_EVENTS.realtime_session_family_revoked_v1",
            "$JS.API.CONSUMER.CREATE.IDENTITY_EVENTS.realtime_session_family_revoked_v1.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
